[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "bart_survival"
authors = [
    {name = "Jacob Tiegs", email = "tiegsjacob@gmail.com"},
]
description = "Survival analyses with Bayesian Additivie Regression Trees using PyMC-BART as BART backend."
version = "0.2.1"
readme = "README.md"
dependencies = [
    "numpy>=2.0.2",
    "scipy>=1.14.1",
    'pymc>=6.0.0',
    'pymc-bart>=0.12.0',
    "cloudpickle",
    'numba>=0.60.0',
]

[project.urls]
Homepage = "https://github.com/CDCgov/BART-Survival"

[tool.setuptools.packages.find]
where = ["src"]
include = ["bart_survival"]  
exclude = ["additional"]
namespaces = false

